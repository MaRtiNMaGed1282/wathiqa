<!doctype html>

<html lang="ar" dir="rtl">
  <head>
    <link rel="icon" type="image/png" href="../assets/faviconw.png" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>عرض القانون</title>

    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/api.js"></script>

    <!-- Cairo -->
    <link rel="stylesheet" href="../assets/css/fonts.css" />
    <!-- Tailwind -->
    <link rel="stylesheet" href="../assets/css/tailwind.min.css" />

    <style>
      body {
        font-family: "Cairo", sans-serif;
      }
    </style>
  </head>

  <body class="bg-light text-primary min-h-screen flex font-cairo">
    <div id="navbar-container"></div>
    <div id="sidebar-container"></div>

    <main class="flex-1 flex flex-col">
      <div class="bg-white shadow p-4 flex justify-between items-center">
        <div>
          <h1 id="lawTitle" class="text-2xl font-bold">جاري التحميل...</h1>

          <p id="lawCategory" class="text-gray-600 mt-1"></p>
        </div>

        <div class="flex gap-2">
          <button
            id="downloadBtn"
            class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700"
          >
            تحميل القانون
          </button>

          <button
            onclick="history.back()"
            class="bg-primary text-white px-4 py-2 rounded hover:bg-secondary"
          >
            رجوع
          </button>
        </div>
      </div>

      <iframe id="pdfViewer" class="flex-1 w-full"></iframe>
    </main>

    <script>
      async function loadLaw() {
        try {
          const params = new URLSearchParams(window.location.search);

          const id = params.get("id");

          const law = await api.get(`/library/laws/${id}`);

          document.getElementById("lawTitle").textContent = law.title;

          document.getElementById("lawCategory").textContent =
            law.category || "";

          const pdfUrl = `/laws-files/${law.pdf_path}`;

          document.getElementById("pdfViewer").src = pdfUrl;

          document.getElementById("downloadBtn").onclick = () => {
            window.open(pdfUrl, "_blank");
          };
        } catch (error) {
          console.error(error);

          document.body.innerHTML = `
        <div class="p-10 text-center text-red-600">
          فشل تحميل القانون
        </div>
      `;
        }
      }

      loadLaw();
    </script>

    <script src="../assets/js/loadSidebar.js"></script>
    <script src="../assets/js/loadNavbar.js"></script>
  </body>
</html>
