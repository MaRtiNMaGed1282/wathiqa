<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <link rel="icon" type="image/png" href="../assets/faviconw.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول | وثيقة</title>
    <link rel="stylesheet" href="../assets/css/fonts.css" />
    <link rel="stylesheet" href="../assets/css/tailwind.min.css" />
    <style>body { font-family: "Cairo", sans-serif; }</style>
  </head>

  <body class="bg-light min-h-screen flex items-center justify-center p-6">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">
      <div class="text-center mb-8">
        <img src="../assets/logo.png" alt="وثيقة" class="w-36 mx-auto mb-5" />
        <p class="text-primary font-semibold text-lg">نظام إدارة الموكلين والقضايا</p>
      </div>

      <div id="errorMessage" role="alert" class="hidden bg-red-100 text-red-700 p-3 rounded-lg mb-4 text-center"></div>

      <form id="loginForm" class="space-y-5" novalidate>
        <div>
          <label for="email" class="block mb-2 font-semibold text-primary">البريد الإلكتروني</label>
          <input type="email" id="email" autocomplete="username" required class="w-full border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-accent" />
        </div>

        <div>
          <label for="password" class="block mb-2 font-semibold text-primary">كلمة المرور</label>
          <input type="password" id="password" autocomplete="current-password" minlength="8" required class="w-full border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-accent" />
        </div>

        <label class="flex items-center gap-2 cursor-pointer select-none text-primary font-semibold">
          <input id="rememberMe" type="checkbox" class="w-4 h-4 accent-primary" />
          <span>تذكرني</span>
        </label>

        <button id="loginBtn" type="submit" class="w-full bg-primary hover:bg-secondary text-white py-3 rounded-lg transition font-semibold">تسجيل الدخول</button>
      </form>
    </div>

    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/phase25-state.js"></script>
    <script>
      const API_URL = "/auth/login";

      document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const form = e.currentTarget;
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const rememberMe = document.getElementById("rememberMe").checked;
        const btn = document.getElementById("loginBtn");
        const errorBox = document.getElementById("errorMessage");

        errorBox.classList.add("hidden");

        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        try {
          btn.disabled = true;
          btn.textContent = "جاري تسجيل الدخول...";

          const data = await api.post(API_URL, { email, password }, { busyElement: btn });

          const user = { ...data.user, must_change_password: data.must_change_password };
          auth.setSession(data.token, user, rememberMe);

          window.location.href = data.must_change_password ? "change-password.html" : "dashboard.html";
        } catch (err) {
          errorBox.textContent = err.message || "فشل تسجيل الدخول";
          errorBox.classList.remove("hidden");
        } finally {
          btn.disabled = false;
          btn.textContent = "تسجيل الدخول";
        }
      });
    </script>
  </body>
</html>
