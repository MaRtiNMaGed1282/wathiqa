<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <link rel="icon" type="image/png" href="../assets/faviconw.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول | وثيقة</title>
    <link rel="stylesheet" href="../assets/css/fonts.css" />
    <link rel="stylesheet" href="../assets/css/tailwind.min.css" />
    <style>
      body { font-family: "Cairo", sans-serif; }
    </style>
  </head>

  <body class="bg-light min-h-screen flex items-center justify-center p-6">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">
      <div class="text-center mb-8">
        <img src="../assets/logo.png" alt="وثيقة" class="w-36 mx-auto mb-5" />
        <p class="text-primary font-semibold text-lg">نظام إدارة الموكلين والقضايا</p>
      </div>

      <div id="errorMessage" class="hidden bg-red-100 text-red-700 p-3 rounded-lg mb-4 text-center" role="alert"></div>

      <form id="loginForm" class="space-y-5">
        <div>
          <label class="block mb-2 font-semibold text-primary" for="email">البريد الإلكتروني</label>
          <input type="email" id="email" required autocomplete="username" class="w-full border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-accent" />
        </div>

        <div>
          <label class="block mb-2 font-semibold text-primary" for="password">كلمة المرور</label>
          <input type="password" id="password" required autocomplete="current-password" class="w-full border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-accent" />
        </div>

        <button id="loginBtn" type="submit" class="w-full bg-primary hover:bg-secondary text-white py-3 rounded-lg transition font-semibold">
          تسجيل الدخول
        </button>
      </form>
    </div>

    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/api.js"></script>

    <script>
      "use strict";

      const form = document.getElementById("loginForm");
      const button = document.getElementById("loginBtn");
      const errorBox = document.getElementById("errorMessage");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        try {
          button.disabled = true;
          button.textContent = "جاري تسجيل الدخول...";
          errorBox.classList.add("hidden");

          const data = await api.post("/auth/login", { email, password });

          auth.setToken(data.token);
          auth.setUser({
            ...data.user,
            must_change_password: Boolean(data.must_change_password),
          });

          window.location.replace(
            data.must_change_password ? "change-password.html" : "dashboard.html",
          );
        } catch (error) {
          errorBox.textContent = error?.message || "تعذر تسجيل الدخول";
          errorBox.classList.remove("hidden");
        } finally {
          button.disabled = false;
          button.textContent = "تسجيل الدخول";
        }
      });
    </script>
  </body>
</html>
