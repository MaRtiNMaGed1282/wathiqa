<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <link rel="icon" type="image/png" href="../assets/faviconw.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>التقويم والمواعيد</title>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/api.js"></script>
    <link rel="stylesheet" href="../assets/css/fonts.css" />
    <link rel="stylesheet" href="../assets/css/tailwind.min.css" />
    <script src="../assets/vendor/fullcalendar/core/index.global.min.js"></script>
    <script src="../assets/vendor/fullcalendar/daygrid/index.global.min.js"></script>
    <script src="../assets/vendor/fullcalendar/timegrid/index.global.min.js"></script>
    <script src="../assets/vendor/fullcalendar/interaction/index.global.min.js"></script>
    <script src="../assets/vendor/fullcalendar/locales/ar.global.min.js"></script>
    <script src="../assets/vendor/sweetalert2/sweetalert2.all.min.js"></script>
    <style>
      body { font-family: "Cairo", sans-serif; }
      .fc-toolbar-title { font-size: 1.35rem !important; font-weight: 700; }
      .fc-button { background: #293040 !important; border: none !important; }
      .fc-button:hover { background: #3b475c !important; }
      .fc-event { border: none !important; cursor: pointer; padding: 3px; }
      .fc-daygrid-event-dot { display: none; }
      .fc-event-main { color: #fff !important; }
      .fc-daygrid-event { white-space: nowrap !important; overflow: hidden !important; text-overflow: ellipsis !important; max-width: 100% !important; }
      .fc-view-harness { overflow: visible !important; }
      .fc-scrollgrid { table-layout: fixed !important; width: 100% !important; }
      .fc-col-header, .fc-daygrid-body, .fc-scrollgrid-sync-table { width: 100% !important; }
    </style>
  </head>
  <body class="bg-light text-primary min-h-screen flex font-cairo">
    <div id="navbar-container"></div>
    <div id="sidebar-container"></div>

    <main class="flex-1 p-6">
      <div class="flex flex-wrap justify-between items-center gap-4 mb-6">
        <div>
          <h1 class="text-2xl font-bold">التقويم والمواعيد</h1>
          <p class="text-gray-500 mt-1">الجلسات ومواعيد الخدمات المرتبطة بملفات النظام</p>
        </div>
        <button id="newHearingButton" type="button" class="px-5 py-3 rounded-xl bg-primary text-white font-semibold hover:opacity-90 transition">
          + إضافة جلسة
        </button>
      </div>

      <div id="pageLoading" class="bg-white rounded-2xl shadow p-8 text-center text-gray-500 mb-6">جاري تحميل التقويم...</div>
      <div id="pageError" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-2xl p-5 mb-6"></div>

      <section class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
        <div class="bg-white rounded-2xl shadow p-5"><p class="text-sm text-gray-500">جلسات اليوم</p><h2 id="todayCount" class="text-3xl font-bold mt-2">0</h2></div>
        <div class="bg-white rounded-2xl shadow p-5"><p class="text-sm text-gray-500">خلال 7 أيام</p><h2 id="weekCount" class="text-3xl font-bold mt-2">0</h2></div>
        <div class="bg-white rounded-2xl shadow p-5"><p class="text-sm text-gray-500">مواعيد الخدمات</p><h2 id="serviceCount" class="text-3xl font-bold mt-2">0</h2></div>
        <div class="bg-white rounded-2xl shadow p-5"><p class="text-sm text-gray-500">إجمالي الأحداث</p><h2 id="totalCount" class="text-3xl font-bold mt-2">0</h2></div>
      </section>

      <section class="bg-white shadow rounded-2xl p-5">
        <div class="flex flex-wrap gap-5 mb-5 text-sm">
          <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-green-600"></span>جلسة اليوم</div>
          <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-yellow-500"></span>جلسة قريبة</div>
          <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-blue-600"></span>جلسة مستقبلية</div>
          <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-red-600"></span>جلسة متأخرة</div>
          <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-purple-600"></span>موعد خدمة</div>
        </div>
        <div id="calendar"></div>
      </section>
    </main>

    <div id="hearingModal" class="hidden fixed inset-0 z-50 items-center justify-center bg-black/50 p-4">
      <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between p-5 border-b">
          <h2 class="text-xl font-bold">إضافة جلسة</h2>
          <button type="button" id="closeModalButton" class="text-gray-500 text-2xl">×</button>
        </div>
        <form id="hearingForm" class="p-5 space-y-4">
          <div>
            <label class="block mb-2 font-semibold">القضية</label>
            <select id="hearingCase" required class="w-full border rounded-xl px-4 py-3 bg-white"></select>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div><label class="block mb-2 font-semibold">التاريخ</label><input id="hearingDate" type="date" required class="w-full border rounded-xl px-4 py-3" /></div>
            <div><label class="block mb-2 font-semibold">الوقت</label><input id="hearingTime" type="time" class="w-full border rounded-xl px-4 py-3" /></div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div><label class="block mb-2 font-semibold">نوع الجلسة</label><input id="hearingType" required class="w-full border rounded-xl px-4 py-3" placeholder="جلسة" /></div>
            <div><label class="block mb-2 font-semibold">اسم القاضي</label><input id="judgeName" class="w-full border rounded-xl px-4 py-3" /></div>
          </div>
          <div><label class="block mb-2 font-semibold">قاعة المحكمة</label><input id="courtroom" class="w-full border rounded-xl px-4 py-3" /></div>
          <div><label class="block mb-2 font-semibold">ملاحظات</label><textarea id="hearingNotes" rows="3" class="w-full border rounded-xl px-4 py-3"></textarea></div>
          <div class="flex justify-end gap-3 pt-2">
            <button type="button" id="cancelModalButton" class="px-5 py-3 rounded-xl border">إلغاء</button>
            <button type="submit" class="px-5 py-3 rounded-xl bg-primary text-white font-semibold">حفظ الجلسة</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const CALENDAR_API = "/calendar";
      const HEARINGS_API = "/hearings";
      let calendarInstance = null;
      let calendarItems = [];
      const currentUser = window.auth?.getUser?.() || {};
      const canModifyExistingHearings = currentUser.role === "admin" || currentUser.role === "lawyer";

      function dateOnly(value) {
        return String(value || "").split("T")[0];
      }

      function parseLocalDate(value) {
        const [year, month, day] = dateOnly(value).split("-").map(Number);
        return new Date(year, month - 1, day);
      }

      function sameDay(a, b) {
        return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
      }

      function showError(message) {
        const el = document.getElementById("pageError");
        el.textContent = message;
        el.classList.remove("hidden");
      }

      function clearError() {
        document.getElementById("pageError").classList.add("hidden");
      }

      function eventColor(item) {
        if (item.event_type === "service_deadline") return "#7c3aed";
        const today = new Date(); today.setHours(0, 0, 0, 0);
        const eventDate = parseLocalDate(item.event_date); eventDate.setHours(0, 0, 0, 0);
        const diff = Math.floor((eventDate - today) / 86400000);
        if (diff < 0) return "#dc2626";
        if (diff === 0) return "#16a34a";
        if (diff <= 7) return "#d3ac2b";
        return "#2563eb";
      }

      function buildEvents(items) {
        return items.map((item) => ({
          id: `${item.event_type}-${item.event_id}`,
          title: item.event_type === "service_deadline" ? `موعد خدمة: ${item.service_title || "خدمة"}` : (item.case_title || "جلسة"),
          start: item.event_time ? `${dateOnly(item.event_date)}T${item.event_time}` : dateOnly(item.event_date),
          allDay: !item.event_time,
          color: eventColor(item),
          backgroundColor: eventColor(item),
          borderColor: eventColor(item),
          extendedProps: item,
        }));
      }

      function calculateStats(items) {
        const now = new Date();
        const today = new Date(now); today.setHours(0, 0, 0, 0);
        const weekEnd = new Date(today); weekEnd.setDate(weekEnd.getDate() + 7);
        const hearings = items.filter((item) => item.event_type === "hearing");
        const services = items.filter((item) => item.event_type === "service_deadline");
        const todayHearings = hearings.filter((item) => sameDay(parseLocalDate(item.event_date), today)).length;
        const weekItems = items.filter((item) => {
          const d = parseLocalDate(item.event_date); d.setHours(0, 0, 0, 0);
          return d >= today && d <= weekEnd;
        }).length;
        document.getElementById("todayCount").textContent = todayHearings;
        document.getElementById("weekCount").textContent = weekItems;
        document.getElementById("serviceCount").textContent = services.length;
        document.getElementById("totalCount").textContent = items.length;
      }

      function renderCalendar(items) {
        const calendarEl = document.getElementById("calendar");
        if (calendarInstance) calendarInstance.destroy();
        calendarInstance = new FullCalendar.Calendar(calendarEl, {
          locale: "ar",
          direction: "rtl",
          firstDay: 0,
          initialView: "dayGridMonth",
          height: "auto",
          contentHeight: 700,
          expandRows: true,
          dayMaxEvents: true,
          editable: canModifyExistingHearings,
          eventStartEditable: canModifyExistingHearings,
          eventDurationEditable: false,
          buttonText: { today: "اليوم", month: "شهري", week: "أسبوعي", day: "يومي" },
          headerToolbar: { left: "prev,next today", center: "title", right: "dayGridMonth,timeGridWeek,timeGridDay" },
          events: buildEvents(items),
          dateClick(info) { openHearingModal(info.dateStr); },
          eventContent(info) {
            const item = info.event.extendedProps;
            const time = item.event_time ? String(item.event_time).substring(0, 5) : "";
            return { html: `<div class="overflow-hidden"><div class="font-semibold truncate">${info.event.title}</div>${time ? `<div class="text-xs opacity-90">${time}</div>` : ""}</div>` };
          },
          eventDrop: async (info) => {
            const item = info.event.extendedProps;
            if (item.event_type !== "hearing") {
              info.revert();
              return;
            }
            try {
              const hearing = await api.get(`${HEARINGS_API}/${item.event_id}`);
              await api.put(`${HEARINGS_API}/${item.event_id}`, { ...hearing, hearing_date: dateOnly(info.event.startStr) });
              await loadCalendar();
              Swal.fire("تم", "تم تعديل موعد الجلسة", "success");
            } catch (error) {
              info.revert();
              Swal.fire("خطأ", error?.message || "فشل تعديل موعد الجلسة", "error");
            }
          },
          eventClick(info) { openEventDetails(info.event.extendedProps); },
        });
        calendarInstance.render();
      }

      function openEventDetails(item) {
        if (item.event_type === "service_deadline") {
          Swal.fire({
            title: item.service_title || "موعد خدمة",
            html: `<div class="text-right space-y-2"><p><strong>العميل:</strong> ${item.client_name || "-"}</p><p><strong>نوع الخدمة:</strong> ${item.subtype || "-"}</p><p><strong>تاريخ الاستحقاق:</strong> ${dateOnly(item.event_date)}</p><p><strong>الحالة:</strong> ${item.service_status || "-"}</p><p><strong>الأولوية:</strong> ${item.priority_level || "-"}</p></div>`,
            confirmButtonText: "فتح الخدمة",
            showCancelButton: true,
            cancelButtonText: "إغلاق",
          }).then((result) => {
            if (result.isConfirmed) window.location.href = `service-profile.html?id=${item.service_id}`;
          });
          return;
        }

        const buttons = {
          title: item.case_title || "جلسة",
          html: `<div class="text-right space-y-2"><p><strong>رقم القضية:</strong> ${item.court_case_number || "-"}</p><p><strong>العميل:</strong> ${item.client_name || "-"}</p><p><strong>نوع الجلسة:</strong> ${item.subtype || "-"}</p><p><strong>المحكمة:</strong> ${item.court_name || "-"}</p><p><strong>القاضي:</strong> ${item.judge_name || "-"}</p><p><strong>القاعة:</strong> ${item.courtroom || "-"}</p><p><strong>النتيجة:</strong> ${item.result || "مجدولة"}</p></div>`,
          confirmButtonText: "فتح القضية",
          showDenyButton: canModifyExistingHearings,
          denyButtonText: "حذف الجلسة",
          showCancelButton: true,
          cancelButtonText: "إغلاق",
        };
        Swal.fire(buttons).then(async (result) => {
          if (result.isConfirmed) {
            window.location.href = `case-profile.html?id=${item.case_id}`;
          } else if (result.isDenied && canModifyExistingHearings) {
            const confirmation = await Swal.fire({
              title: "حذف الجلسة؟",
              text: "لا يمكن التراجع عن هذا الإجراء.",
              icon: "warning",
              showCancelButton: true,
              confirmButtonText: "حذف",
              cancelButtonText: "إلغاء",
            });
            if (!confirmation.isConfirmed) return;
            try {
              await api.delete(`${HEARINGS_API}/${item.event_id}`);
              await loadCalendar();
              Swal.fire("تم", "تم حذف الجلسة", "success");
            } catch (error) {
              Swal.fire("خطأ", error?.message || "فشل حذف الجلسة", "error");
            }
          }
        });
      }

      async function loadCases() {
        const cases = await api.get("/cases");
        const select = document.getElementById("hearingCase");
        select.innerHTML = "";
        if (!Array.isArray(cases) || !cases.length) {
          select.innerHTML = '<option value="">لا توجد قضايا متاحة</option>';
          return;
        }
        cases.forEach((item) => {
          const option = document.createElement("option");
          option.value = item.case_id;
          option.textContent = `${item.case_title || "قضية"} — ${item.court_case_number || "بدون رقم"}`;
          select.appendChild(option);
        });
      }

      async function openHearingModal(date) {
        try {
          await loadCases();
          document.getElementById("hearingDate").value = date || dateOnly(new Date().toISOString());
          document.getElementById("hearingModal").classList.remove("hidden");
          document.getElementById("hearingModal").classList.add("flex");
        } catch (error) {
          Swal.fire("خطأ", error?.message || "تعذر تحميل القضايا", "error");
        }
      }

      function closeHearingModal() {
        document.getElementById("hearingModal").classList.add("hidden");
        document.getElementById("hearingModal").classList.remove("flex");
        document.getElementById("hearingForm").reset();
      }

      async function saveHearing(event) {
        event.preventDefault();
        const payload = {
          case_id: document.getElementById("hearingCase").value,
          hearing_date: document.getElementById("hearingDate").value,
          hearing_time: document.getElementById("hearingTime").value || null,
          hearing_type: document.getElementById("hearingType").value.trim(),
          judge_name: document.getElementById("judgeName").value.trim() || null,
          courtroom: document.getElementById("courtroom").value.trim() || null,
          hearing_result: "",
          notes: document.getElementById("hearingNotes").value.trim() || null,
          next_hearing_date: null,
          postponement_reason: "",
        };
        try {
          await api.post(HEARINGS_API, payload);
          closeHearingModal();
          await loadCalendar();
          Swal.fire("تم", "تمت إضافة الجلسة بنجاح", "success");
        } catch (error) {
          Swal.fire("خطأ", error?.message || "فشل إضافة الجلسة", "error");
        }
      }

      async function loadCalendar() {
        clearError();
        document.getElementById("pageLoading").classList.remove("hidden");
        try {
          const response = await api.get(CALENDAR_API);
          calendarItems = Array.isArray(response) ? response : [];
          calculateStats(calendarItems);
          renderCalendar(calendarItems);
        } catch (error) {
          showError(error?.message || "تعذر تحميل بيانات التقويم");
          renderCalendar([]);
        } finally {
          document.getElementById("pageLoading").classList.add("hidden");
        }
      }

      document.getElementById("newHearingButton").addEventListener("click", () => openHearingModal(dateOnly(new Date().toISOString())));
      document.getElementById("closeModalButton").addEventListener("click", closeHearingModal);
      document.getElementById("cancelModalButton").addEventListener("click", closeHearingModal);
      document.getElementById("hearingForm").addEventListener("submit", saveHearing);
      document.getElementById("hearingModal").addEventListener("click", (event) => {
        if (event.target.id === "hearingModal") closeHearingModal();
      });

      loadCalendar();
    </script>

    <script src="../assets/js/loadSidebar.js"></script>
    <script src="../assets/js/loadNavbar.js"></script>
  </body>
</html>
