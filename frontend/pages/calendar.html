<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <link rel="icon" type="image/png" href="../assets/faviconw.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>التقويم والمواعيد</title>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/api.js"></script>
    <link rel="stylesheet" href="../assets/css/fonts.css" />
    <link rel="stylesheet" href="../assets/css/tailwind.min.css" />
    <script src="../assets/vendor/fullcalendar/core/index.global.min.js"></script>
    <script src="../assets/vendor/fullcalendar/daygrid/index.global.min.js"></script>
    <script src="../assets/vendor/fullcalendar/timegrid/index.global.min.js"></script>
    <script src="../assets/vendor/fullcalendar/interaction/index.global.min.js"></script>
    <script src="../assets/vendor/fullcalendar/locales/ar.global.min.js"></script>
    <script src="../assets/vendor/sweetalert2/sweetalert2.all.min.js"></script>
    <style>
      body{font-family:"Cairo",sans-serif}.fc-toolbar-title{font-size:1.4rem!important;font-weight:700}.fc-button{background:#293040!important;border:none!important}.fc-event{border:none!important;cursor:pointer;padding:3px}.fc-event-main{color:#fff!important}.fc-daygrid-event{white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}.fc-scrollgrid{table-layout:fixed!important;width:100%!important}.fc-col-header,.fc-daygrid-body,.fc-scrollgrid-sync-table{width:100%!important}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:1rem}.modal.open{display:flex}.field{width:100%;border:1px solid #d1d5db;border-radius:.5rem;padding:.7rem;background:#fff}.label{display:block;margin-bottom:.4rem;font-weight:600}
    </style>
  </head>
  <body class="bg-light text-primary min-h-screen flex">
    <div id="navbar-container"></div><div id="sidebar-container"></div>
    <main class="flex-1 p-6">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 mb-6">
        <div><h1 class="text-2xl font-bold">التقويم والمواعيد</h1><p class="text-gray-500 text-sm mt-1">الجلسات القضائية ومواعيد تسليم الخدمات</p></div>
        <button id="addHearingTop" class="bg-accent text-white px-4 py-2 rounded-lg">+ إضافة جلسة</button>
      </div>

      <div id="pageError" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-lg p-4 mb-6"></div>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div class="bg-white rounded-lg shadow p-4"><p class="text-gray-500">مواعيد اليوم</p><h3 id="todayCount" class="text-3xl font-bold">0</h3></div>
        <div class="bg-white rounded-lg shadow p-4"><p class="text-gray-500">خلال 7 أيام</p><h3 id="weekCount" class="text-3xl font-bold">0</h3></div>
        <div class="bg-white rounded-lg shadow p-4"><p class="text-gray-500">هذا الشهر</p><h3 id="monthCount" class="text-3xl font-bold">0</h3></div>
        <div class="bg-white rounded-lg shadow p-4"><p class="text-gray-500">إجمالي المواعيد</p><h3 id="totalCount" class="text-3xl font-bold">0</h3></div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
        <section class="lg:col-span-3 bg-white shadow rounded-lg p-5 min-w-0">
          <div class="flex flex-wrap gap-4 mb-5 text-sm">
            <span class="flex items-center gap-2"><i class="w-3 h-3 rounded-full bg-green-600"></i>اليوم</span>
            <span class="flex items-center gap-2"><i class="w-3 h-3 rounded-full bg-yellow-500"></i>خلال 7 أيام</span>
            <span class="flex items-center gap-2"><i class="w-3 h-3 rounded-full bg-blue-600"></i>مستقبلية</span>
            <span class="flex items-center gap-2"><i class="w-3 h-3 rounded-full bg-red-600"></i>متأخرة</span>
            <span class="flex items-center gap-2"><i class="w-3 h-3 rounded-full bg-purple-600"></i>موعد خدمة</span>
          </div>
          <div id="calendar"></div>
          <hr class="my-6" />
          <h2 class="text-lg font-bold mb-4">أقرب المواعيد</h2>
          <div id="upcomingContainer" class="space-y-3"><p class="text-gray-500">جاري التحميل...</p></div>
        </section>

        <aside class="bg-white shadow rounded-lg p-4 h-fit">
          <h2 class="text-lg font-bold border-b pb-3 mb-4">مواعيد اليوم</h2>
          <div id="todayContainer" class="space-y-3"><p class="text-gray-500">جاري التحميل...</p></div>
        </aside>
      </div>
    </main>

    <div id="hearingModal" class="modal">
      <div class="bg-white rounded-2xl shadow-xl w-full max-w-3xl p-6 max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between mb-6"><h2 id="hearingModalTitle" class="text-xl font-bold">إضافة جلسة</h2><button data-close="hearingModal" class="text-2xl text-gray-500">×</button></div>
        <input id="hearingId" type="hidden" />
        <div class="grid md:grid-cols-2 gap-4">
          <div><label class="label">القضية</label><select id="hearingCaseId" class="field"></select></div>
          <div><label class="label">تاريخ الجلسة</label><input id="hearingDate" type="date" class="field" /></div>
          <div><label class="label">الوقت</label><input id="hearingTime" type="time" class="field" /></div>
          <div><label class="label">نوع الجلسة</label><input id="hearingType" class="field" /></div>
          <div><label class="label">القاضي</label><input id="hearingJudge" class="field" /></div>
          <div><label class="label">رقم/قاعة المحكمة</label><input id="hearingCourtroom" class="field" /></div>
          <div><label class="label">النتيجة</label><input id="hearingResult" class="field" /></div>
          <div><label class="label">الجلسة القادمة</label><input id="nextHearingDate" type="date" class="field" /></div>
          <div class="md:col-span-2"><label class="label">سبب التأجيل</label><input id="postponementReason" class="field" /></div>
          <div class="md:col-span-2"><label class="label">ملاحظات</label><textarea id="hearingNotes" rows="4" class="field"></textarea></div>
        </div>
        <div class="flex justify-between gap-2 mt-6"><button id="deleteHearingBtn" class="hidden bg-red-600 text-white px-4 py-2 rounded-lg">حذف الجلسة</button><div class="flex gap-2 mr-auto"><button data-close="hearingModal" class="px-4 py-2 bg-gray-200 rounded-lg">إلغاء</button><button id="saveHearingBtn" class="px-5 py-2 bg-accent text-white rounded-lg">حفظ</button></div></div>
      </div>
    </div>

    <script src="../assets/js/loadSidebar.js"></script><script src="../assets/js/loadNavbar.js"></script>
    <script>
      (()=>{
        "use strict";
        const API="/hearings";let events=[];let calendar=null;let editingId=null;let cases=[];
        const $=id=>document.getElementById(id);const role=()=>window.auth?.getCurrentRole?.()||null;const canDelete=()=>role()==="admin"||role()==="lawyer";
        const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;");
        const dateOnly=v=>String(v||"").split("T")[0];
        function parseDate(v){const p=dateOnly(v).split("-");return new Date(Number(p[0]),Number(p[1])-1,Number(p[2]));}
        function startOfDay(d=new Date()){d=new Date(d);d.setHours(0,0,0,0);return d;}
        function diffDays(v){return Math.round((startOfDay(parseDate(v))-startOfDay())/86400000);}
        function colorFor(v,type){if(type==="service_deadline")return "#7c3aed";const d=diffDays(v);return d<0?"#dc2626":d===0?"#16a34a":d<=7?"#d3ac2b":"#2563eb";}
        function toast(msg,ok=true){if(window.Toastify)Toastify({text:msg,duration:3000,gravity:"top",position:"center",style:{background:ok?"#16a34a":"#dc2626"}}).showToast();else alert(msg);}
        function error(msg){$("pageError").textContent=msg;$("pageError").classList.remove("hidden");}
        function clearError(){$("pageError").classList.add("hidden");}
        function openModal(){ $("hearingModal").classList.add("open"); }
        function closeModal(){ $("hearingModal").classList.remove("open"); editingId=null; }
        function resetForm(){["hearingId","hearingTime","hearingType","hearingJudge","hearingCourtroom","hearingResult","nextHearingDate","postponementReason","hearingNotes"].forEach(id=>$(id).value="");$("hearingDate").value=new Date().toISOString().slice(0,10);$("hearingModalTitle").textContent="إضافة جلسة";$("deleteHearingBtn").classList.toggle("hidden",!canDelete());}
        async function loadCases(selected=""){cases=await api.get("/cases");$("hearingCaseId").innerHTML=cases.map(c=>`<option value="${c.case_id}">${esc(c.case_title||"قضية")} — ${esc(c.court_case_number||"")}</option>`).join("");if(selected)$("hearingCaseId").value=selected;}
        async function openAdd(date){resetForm();await loadCases();if(date)$("hearingDate").value=date;openModal();}
        async function openEdit(id){const h=await api.get(`${API}/${id}`);editingId=Number(id);await loadCases(h.case_id);$("hearingId").value=id;$("hearingDate").value=dateOnly(h.hearing_date);$("hearingTime").value=(h.hearing_time||"").slice(0,5);$("hearingType").value=h.hearing_type||"";$("hearingJudge").value=h.judge_name||"";$("hearingCourtroom").value=h.courtroom||"";$("hearingResult").value=h.hearing_result||"";$("nextHearingDate").value=h.next_hearing_date||"";$("postponementReason").value=h.postponement_reason||"";$("hearingNotes").value=h.notes||"";$("hearingModalTitle").textContent="تعديل الجلسة";$("deleteHearingBtn").classList.toggle("hidden",!canDelete());openModal();}
        async function save(){const payload={case_id:Number($("hearingCaseId").value),hearing_date:$("hearingDate").value,hearing_time:$("hearingTime").value,hearing_type:$("hearingType").value.trim(),judge_name:$("hearingJudge").value.trim(),courtroom:$("hearingCourtroom").value.trim(),hearing_result:$("hearingResult").value.trim(),next_hearing_date:$("nextHearingDate").value||null,postponement_reason:$("postponementReason").value.trim(),notes:$("hearingNotes").value.trim()};if(!payload.case_id||!payload.hearing_date)return toast("القضية وتاريخ الجلسة مطلوبان",false);if(payload.next_hearing_date&&payload.next_hearing_date<payload.hearing_date)return toast("تاريخ الجلسة القادمة لا يمكن أن يسبق الجلسة الحالية",false);try{if(editingId)await api.put(`${API}/${editingId}`,payload);else await api.post(API,payload);toast(editingId?"تم تعديل الجلسة":"تم إضافة الجلسة");closeModal();await loadCalendar();}catch(e){console.error(e);toast(e?.message||"فشل حفظ الجلسة",false);}}
        async function removeHearing(){if(!editingId||!canDelete())return;const r=await Swal.fire({title:"حذف الجلسة؟",text:"لا يمكن التراجع بعد الحذف",icon:"warning",showCancelButton:true,confirmButtonText:"نعم، حذف",cancelButtonText:"إلغاء"});if(!r.isConfirmed)return;try{await api.delete(`${API}/${editingId}`);toast("تم حذف الجلسة");closeModal();await loadCalendar();}catch(e){toast(e?.message||"فشل حذف الجلسة",false);}}
        function renderLists(data){const today=data.filter(x=>diffDays(x.event_date)===0).sort((a,b)=>(a.event_time||"").localeCompare(b.event_time||""));const upcoming=data.filter(x=>diffDays(x.event_date)>=0).sort((a,b)=>`${a.event_date}${a.event_time||""}`.localeCompare(`${b.event_date}${b.event_time||""}`)).slice(0,10);$("todayContainer").innerHTML=today.length?today.map(card).join(""):"<p class=\"text-gray-500\">لا توجد مواعيد اليوم</p>";$("upcomingContainer").innerHTML=upcoming.length?upcoming.map(card).join(""):"<p class=\"text-gray-500\">لا توجد مواعيد قادمة</p>";}
        function card(x){const isService=x.event_type==="service_deadline";return `<button type="button" data-event-id="${x.event_id}" data-event-type="${x.event_type}" class="w-full text-right border rounded-lg p-3 hover:bg-gray-50"><div class="font-semibold">${esc(x.title||"موعد")}</div><div class="text-sm text-gray-500">${esc(x.event_subtype||"")}</div><div class="text-xs font-bold mt-1" style="color:${colorFor(x.event_date,x.event_type)}">${esc(x.event_date)} ${esc((x.event_time||"").slice(0,5))}</div><div class="text-xs text-gray-400 mt-1">${esc(x.reference_number||"")}</div></button>`;}
        function stats(data){const t=data.filter(x=>diffDays(x.event_date)===0).length,w=data.filter(x=>diffDays(x.event_date)>=0&&diffDays(x.event_date)<=7).length,m=data.filter(x=>{const d=parseDate(x.event_date),n=new Date();return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear()}).length;$("todayCount").textContent=t;$("weekCount").textContent=w;$("monthCount").textContent=m;$("totalCount").textContent=data.length;}
        function renderCalendar(data){if(calendar)calendar.destroy();const el=$("calendar");const fcEvents=data.map(x=>({id:`${x.event_type}-${x.event_id}`,title:x.event_type==="service_deadline"?`خدمة: ${x.title}`:x.title,start:`${dateOnly(x.event_date)}${x.event_time?`T${x.event_time}`:""}`,color:colorFor(x.event_date,x.event_type),extendedProps:x}));calendar=new FullCalendar.Calendar(el,{locale:"ar",direction:"rtl",firstDay:0,initialView:"dayGridMonth",height:700,contentHeight:"auto",expandRows:true,dayMaxEvents:true,editable:true,eventStartEditable:true,buttonText:{today:"اليوم",month:"عرض شهري",week:"عرض أسبوعي",day:"عرض يومي"},headerToolbar:{left:"prev,next today",center:"title",right:"dayGridMonth,timeGridWeek,timeGridDay"},events:fcEvents,dateClick:info=>openAdd(info.dateStr),eventContent:info=>({html:`<div style="overflow:hidden"><div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(info.event.title)}</div>${info.event.extendedProps.event_time?`<div style="font-size:11px">${esc(info.event.extendedProps.event_time.slice(0,5))}</div>`:""}</div>`}),eventDrop:async info=>{const x=info.event.extendedProps;if(x.event_type!=="hearing"){info.revert();return toast("مواعيد تسليم الخدمات مرتبطة بالخدمة ولا تُعدّل من التقويم",false)}try{const h=await api.get(`${API}/${x.event_id}`);await api.put(`${API}/${x.event_id}`,{...h,hearing_date:dateOnly(info.event.startStr)});toast("تم تعديل موعد الجلسة");await loadCalendar();}catch(e){info.revert();toast(e?.message||"فشل تعديل الموعد",false);}},eventClick:info=>showEvent(info.event.extendedProps)});calendar.render();}
        async function showEvent(x){if(x.event_type==="service_deadline"){await Swal.fire({title:x.title,html:`<div class="text-right"><p><b>رقم الخدمة:</b> ${esc(x.reference_number||"-")}</p><p><b>المسؤول:</b> ${esc(x.person_name||"-")}</p><p><b>الحالة:</b> ${esc(x.result||"-")}</p><p><b>موعد التسليم:</b> ${esc(x.event_date)}</p></div>`,showCancelButton:true,confirmButtonText:"فتح الخدمة",cancelButtonText:"إغلاق"}).then(r=>{if(r.isConfirmed)location.href=`service-profile.html?id=${x.service_id}`});return;}const result=await Swal.fire({title:x.title,html:`<div class="text-right"><p><b>نوع الجلسة:</b> ${esc(x.event_subtype||"-")}</p><p><b>رقم القضية:</b> ${esc(x.reference_number||"-")}</p><p><b>القاضي:</b> ${esc(x.person_name||"-")}</p><p><b>القاعة:</b> ${esc(x.location||"-")}</p><p><b>النتيجة:</b> ${esc(x.result||"-")}</p><p><b>التاريخ:</b> ${esc(x.event_date)} ${esc((x.event_time||"").slice(0,5))}</p></div>`,showDenyButton:true,showCancelButton:true,confirmButtonText:"فتح القضية",denyButtonText:"تعديل الجلسة",cancelButtonText:"إغلاق"});if(result.isConfirmed)location.href=`case-profile.html?id=${x.case_id}`;else if(result.isDenied)openEdit(x.event_id);}
        async function loadCalendar(){try{clearError();const data=await api.get(`${API}/calendar`);events=Array.isArray(data)?data:[];stats(events);renderLists(events);renderCalendar(events);}catch(e){console.error(e);error(e?.message||"تعذر تحميل التقويم");$("todayContainer").innerHTML="<p class=\"text-red-600\">فشل تحميل المواعيد</p>";$("upcomingContainer").innerHTML="<p class=\"text-red-600\">فشل تحميل المواعيد</p>";}}
        function bind(){$("addHearingTop").addEventListener("click",()=>openAdd());$("saveHearingBtn").addEventListener("click",save);$("deleteHearingBtn").addEventListener("click",removeHearing);document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",closeModal));["todayContainer","upcomingContainer"].forEach(id=>$(id).addEventListener("click",e=>{const b=e.target.closest("[data-event-id]");if(b){const x=events.find(v=>String(v.event_id)===String(b.dataset.eventId)&&v.event_type===b.dataset.eventType);if(x)showEvent(x);}}));}
        bind();loadCalendar();
        window.openNewHearingFromCalendar=openAdd;window.closeCalendarHearingModal=closeModal;window.saveCalendarHearing=save;
      })();
    </script>
  </body>
</html>
