<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <link rel="icon" type="image/png" href="../assets/faviconw.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الخدمات القانونية</title>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <link rel="stylesheet" href="../assets/css/fonts.css" />
  <link rel="stylesheet" href="../assets/css/tailwind.min.css" />
  <link rel="stylesheet" href="../assets/vendor/toastify/toastify.css" />
  <style>body{font-family:"Cairo",sans-serif}</style>
</head>
<body class="bg-light text-primary min-h-screen flex font-cairo">
<div id="navbar-container"></div><div id="sidebar-container"></div>
<main class="flex-1 p-6 overflow-auto">
  <div class="flex justify-between items-center mb-6">
    <div><h1 class="text-2xl font-bold">إدارة الخدمات القانونية</h1><p class="text-gray-500 mt-1">إدارة الخدمات، المواعيد، المسؤولين والحالات</p></div>
    <button onclick="openAddServiceModal()" class="bg-accent text-white px-5 py-3 rounded-lg">+ إضافة خدمة</button>
  </div>
  <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
    <div class="bg-white rounded-lg shadow p-4"><p class="text-gray-500">إجمالي الخدمات</p><h3 id="totalServices" class="text-3xl font-bold">0</h3></div>
    <div class="bg-white rounded-lg shadow p-4"><p class="text-gray-500">الخدمات النشطة</p><h3 id="activeServices" class="text-3xl font-bold text-blue-600">0</h3></div>
    <div class="bg-white rounded-lg shadow p-4"><p class="text-gray-500">المكتملة</p><h3 id="completedServices" class="text-3xl font-bold text-green-600">0</h3></div>
    <div class="bg-white rounded-lg shadow p-4"><p class="text-gray-500">المتأخرة</p><h3 id="overdueServices" class="text-3xl font-bold text-red-600">0</h3></div>
  </div>
  <div class="bg-white rounded-lg shadow p-4 mb-6 space-y-4">
    <input id="searchInput" placeholder="ابحث برقم الخدمة أو العنوان أو الموكل أو المسؤول" class="w-full border rounded p-3" />
    <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-6 gap-3">
      <select id="filterStatus" class="border rounded p-2"><option value="">كل الحالات</option><option>جديدة</option><option>قيد التنفيذ</option><option>بانتظار العميل</option><option>مكتملة</option><option>ملغاة</option></select>
      <select id="filterType" class="border rounded p-2"><option value="">كل الأنواع</option></select>
      <select id="filterPriority" class="border rounded p-2"><option value="">كل الأولويات</option><option>عادية</option><option>مهمة</option><option>عاجلة</option></select>
      <select id="filterAssigned" class="border rounded p-2"><option value="">كل المسؤولين</option></select>
      <input id="filterFrom" type="date" class="border rounded p-2" title="من تاريخ" />
      <input id="filterTo" type="date" class="border rounded p-2" title="إلى تاريخ" />
    </div>
    <div class="flex gap-2"><button onclick="applyFilters()" class="bg-accent text-white px-4 py-2 rounded">تطبيق الفلاتر</button><button onclick="resetFilters()" class="bg-gray-200 px-4 py-2 rounded">إعادة ضبط</button></div>
  </div>
  <div class="bg-white shadow rounded p-4 overflow-auto">
    <table class="min-w-full text-right"><thead><tr class="bg-secondary text-white">
      <th class="p-2">#</th><th class="p-2">رقم الخدمة</th><th class="p-2">عنوان الخدمة</th><th class="p-2">نوع الخدمة</th><th class="p-2">الموكل</th><th class="p-2">المسؤول</th><th class="p-2">الحالة</th><th class="p-2">الأولوية</th><th class="p-2">بدء</th><th class="p-2">التسليم</th><th id="feesHeader" class="p-2">الأتعاب</th><th class="p-2">الإجراءات</th>
    </tr></thead><tbody id="servicesTableBody"></tbody></table>
  </div>
</main>
<div id="addServiceModal" class="hidden fixed inset-0 bg-black/50 items-center justify-center z-50">
  <div class="bg-white rounded-xl shadow-xl p-8 w-full max-w-4xl max-h-[90vh] overflow-y-auto">
    <div class="flex justify-between items-center mb-6"><h3 class="text-2xl font-bold">إضافة خدمة</h3><button type="button" onclick="closeAddServiceModal()" class="w-10 h-10 rounded-full hover:bg-gray-100 text-xl">✕</button></div>
    <form id="addServiceForm" class="space-y-4">
      <div><label class="block mb-1 font-semibold">الموكل</label><input id="clientSearch" required class="w-full border p-2 rounded" placeholder="ابحث بالاسم أو الرقم القومي" /><div id="clientResults" class="hidden bg-white border rounded mt-1 max-h-60 overflow-auto"></div></div>
      <div class="grid md:grid-cols-2 gap-4">
        <input id="service_title" required placeholder="عنوان الخدمة" class="border p-2 rounded" /><input id="service_type" required placeholder="نوع الخدمة" class="border p-2 rounded" /><input id="assigned_to" required placeholder="المسؤول" class="border p-2 rounded" />
        <select id="priority_level" class="border p-2 rounded"><option>عادية</option><option>مهمة</option><option>عاجلة</option></select>
        <select id="service_status" class="border p-2 rounded"><option>جديدة</option><option>قيد التنفيذ</option><option>بانتظار العميل</option><option>مكتملة</option><option>ملغاة</option></select>
        <input id="start_date" type="date" required class="border p-2 rounded" /><input id="due_date" type="date" required class="border p-2 rounded" /><input id="completed_date" type="date" class="border p-2 rounded" disabled />
      </div>
      <div id="feesField"><label class="block mb-1 font-semibold">إجمالي الأتعاب (جنيه)</label><input id="total_fees" type="number" min="0" step="0.01" value="0" class="w-full border p-2 rounded" /></div>
      <textarea id="description" rows="4" placeholder="وصف الخدمة" class="w-full border p-2 rounded"></textarea><textarea id="notes" rows="3" placeholder="ملاحظات" class="w-full border p-2 rounded"></textarea>
      <div class="flex justify-end gap-2"><button type="button" onclick="closeAddServiceModal()" class="px-5 py-2 bg-gray-200 rounded">إلغاء</button><button type="submit" class="bg-primary text-white px-5 py-2 rounded">حفظ الخدمة</button></div>
    </form>
  </div>
</div>
<script>
const SERVICES_API="/services", CLIENTS_API="/clients"; let selectedClientId=null, allClients=[]; const isAssistant=auth.isAssistant();
const esc=v=>String(v??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;"}[c]));
function showToast(message,success=true){Toastify({text:message,duration:3000,gravity:"top",position:"left",style:{background:success?"#16a34a":"#dc2626"}}).showToast()}
function statusClass(s){if(s==="مكتملة")return"bg-green-100 text-green-700";if(s==="ملغاة")return"bg-red-100 text-red-700";if(s==="قيد التنفيذ")return"bg-yellow-100 text-yellow-700";if(s==="بانتظار العميل")return"bg-orange-100 text-orange-700";return"bg-blue-100 text-blue-700"}
function renderServices(services){const tbody=document.getElementById("servicesTableBody");tbody.innerHTML="";if(!services.length){tbody.innerHTML='<tr><td colspan="12" class="text-center py-10 text-gray-500">لا توجد خدمات مطابقة</td></tr>';return}services.forEach((s,i)=>{const overdue=s.due_date&&s.due_date<new Date().toISOString().slice(0,10)&&!["مكتملة","ملغاة"].includes(s.service_status);tbody.insertAdjacentHTML("beforeend",`<tr class="border-b hover:bg-gray-50 ${overdue?"bg-red-50":""}"><td class="p-2">${i+1}</td><td class="p-2">${esc(s.service_number)}</td><td class="p-2">${esc(s.service_title||"-")}</td><td class="p-2">${esc(s.service_type||"-")}</td><td class="p-2">${esc(s.full_name||"-")}</td><td class="p-2">${esc(s.assigned_to||"-")}</td><td class="p-2"><span class="px-3 py-1 rounded-full text-xs font-bold ${statusClass(s.service_status)}">${esc(s.service_status||"-")}</span></td><td class="p-2">${esc(s.priority_level||"-")}</td><td class="p-2">${esc(s.start_date||"-")}</td><td class="p-2">${overdue?'<span class="text-red-600 font-bold">':''}${esc(s.due_date||"-")}${overdue?'</span>':''}</td>${isAssistant?"":`<td class="p-2">${Number(s.total_fees||0).toLocaleString("ar-EG")} جنيه</td>`}<td class="p-2"><button onclick="openServiceProfile(${Number(s.service_id)})" class="bg-blue-600 text-white px-3 py-1 rounded">عرض</button></td></tr>`)})}
async function loadStats(){try{const s=await api.get("/services/stats");totalServices.textContent=s.total_services;activeServices.textContent=s.active_services;completedServices.textContent=s.completed_services;overdueServices.textContent=s.overdue_services}catch(e){console.error(e)}}
async function fetchServices(){try{const services=await api.get(SERVICES_API);populateFilterOptions(services);renderServices(services);await loadStats()}catch(e){console.error(e);showToast(e.message||"تعذر تحميل الخدمات",false)}}
function populateFilterOptions(services){const types=[...new Set(services.map(s=>s.service_type).filter(Boolean))].sort(),people=[...new Set(services.map(s=>s.assigned_to).filter(Boolean))].sort();filterType.innerHTML='<option value="">كل الأنواع</option>'+types.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");filterAssigned.innerHTML='<option value="">كل المسؤولين</option>'+people.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("")}
async function searchServices(){const q=searchInput.value.trim();if(!q)return applyFilters();try{renderServices(await api.get("/services/search",{params:{q}}))}catch(e){showToast(e.message||"فشل البحث",false)}}
async function applyFilters(){const params={status:filterStatus.value,type:filterType.value,priority:filterPriority.value,assignedTo:filterAssigned.value,fromDate:filterFrom.value,toDate:filterTo.value};try{renderServices(await api.get("/services/filter",{params}))}catch(e){showToast(e.message||"فشل تطبيق الفلاتر",false)}}
function resetFilters(){[filterStatus,filterType,filterPriority,filterAssigned,filterFrom,filterTo,searchInput].forEach(x=>x.value="");fetchServices()}
searchInput.addEventListener("input",()=>{clearTimeout(window.__serviceSearchTimer);window.__serviceSearchTimer=setTimeout(searchServices,250)});
service_status.addEventListener("change",()=>{const done=service_status.value==="مكتملة";completed_date.disabled=!done;if(!done)completed_date.value=""});
addServiceForm.addEventListener("submit",async e=>{e.preventDefault();if(!selectedClientId)return showToast("يرجى اختيار الموكل",false);const status=service_status.value,completed=completed_date.value;if(status==="مكتملة"&&!completed)return showToast("تاريخ الإكمال مطلوب للخدمة المكتملة",false);if(status!=="مكتملة"&&completed)return showToast("تاريخ الإكمال يستخدم فقط للخدمة المكتملة",false);const data={client_id:selectedClientId,service_title:service_title.value.trim(),service_type:service_type.value.trim(),assigned_to:assigned_to.value.trim(),start_date:start_date.value,due_date:due_date.value,priority_level:priority_level.value,service_status:status,completed_date:completed||null,description:description.value.trim(),notes:notes.value.trim()};if(!isAssistant)data.total_fees=total_fees.value||0;try{await api.post(SERVICES_API,data);showToast("تم إضافة الخدمة بنجاح");closeAddServiceModal();e.target.reset();completed_date.disabled=true;selectedClientId=null;fetchServices()}catch(err){showToast(err.message||"حدث خطأ أثناء إضافة الخدمة",false)}});
async function loadClients(){try{allClients=await api.get(CLIENTS_API)}catch(e){console.error(e)}}
clientSearch.addEventListener("input",()=>{const q=clientSearch.value.toLowerCase().trim();if(!q)return clientResults.classList.add("hidden");const results=allClients.filter(c=>(c.full_name||"").toLowerCase().includes(q)||String(c.national_id||"").includes(q)).slice(0,20);clientResults.innerHTML=results.map(c=>`<div onclick="selectClient(${Number(c.id)})" class="p-2 border-b cursor-pointer hover:bg-gray-100"><div>${esc(c.full_name)}</div><div class="text-xs text-gray-500">${esc(c.national_id)}</div></div>`).join("");clientResults.classList.toggle("hidden",!results.length)});
function selectClient(id){const c=allClients.find(x=>Number(x.id)===Number(id));if(!c)return;selectedClientId=c.id;clientSearch.value=c.full_name;clientResults.classList.add("hidden")}
function openServiceProfile(id){window.location.href=`service-profile.html?id=${id}`} function openAddServiceModal(){addServiceModal.classList.remove("hidden");addServiceModal.classList.add("flex")} function closeAddServiceModal(){addServiceModal.classList.add("hidden");addServiceModal.classList.remove("flex")}
if(isAssistant){feesField.classList.add("hidden");feesHeader.classList.add("hidden")} loadClients();fetchServices();
</script>
<script src="../assets/js/loadSidebar.js"></script><script src="../assets/js/loadNavbar.js"></script><script src="../assets/vendor/toastify/toastify.js"></script>
</body></html>
