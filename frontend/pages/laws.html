<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <link rel="icon" type="image/png" href="../assets/faviconw.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>القوانين المصرية</title>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/api.js"></script>
    <link rel="stylesheet" href="../assets/css/fonts.css" />
    <link rel="stylesheet" href="../assets/css/tailwind.min.css" />
    <style>
      body { font-family: "Cairo", sans-serif; }
      #lawsTableBody td { color: #273247 !important; }
      #lawsTableBody td button[data-view] { background: #273247 !important; color: #ffffff !important; }
      #lawsTableBody td button[data-download] { background: #16a34a !important; color: #ffffff !important; }
      #lawsTableBody td button { border: 0; }
    </style>
  </head>

  <body class="bg-light text-primary min-h-screen flex font-cairo">
    <div id="navbar-container"></div>
    <div id="sidebar-container"></div>

    <main class="flex-1 p-6 overflow-auto">
      <div class="mb-6">
        <h1 class="text-3xl font-bold">القوانين المصرية</h1>
        <p class="text-gray-600 mt-2">مكتبة القوانين والتشريعات المصرية — قراءة وعرض وتحميل فقط.</p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5"><p class="text-gray-500">إجمالي القوانين</p><h3 id="totalLaws" class="text-3xl font-bold mt-2">0</h3></div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5"><p class="text-gray-500">نتائج البحث</p><h3 id="visibleLaws" class="text-3xl font-bold mt-2">0</h3></div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5"><label for="searchLaw" class="text-gray-500">البحث</label><input id="searchLaw" type="search" placeholder="ابحث باسم القانون أو التصنيف..." class="w-full border rounded p-2 mt-2" /></div>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div id="lawsState" class="hidden p-8 text-center text-gray-500"></div>
        <div class="overflow-x-auto">
          <table class="w-full text-right">
            <thead><tr class="bg-secondary text-white"><th class="p-3">#</th><th class="p-3">اسم القانون</th><th class="p-3">التصنيف</th><th class="p-3">الإجراءات</th></tr></thead>
            <tbody id="lawsTableBody"></tbody>
          </table>
        </div>
      </div>
    </main>

    <script>
      "use strict";
      let searchTimer = null;
      const tbody = document.getElementById("lawsTableBody");
      const stateBox = document.getElementById("lawsState");

      function escapeHtml(value) { return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\"/g, "&quot;").replace(/'/g, "&#039;"); }
      function setState(message, visible = true) { stateBox.textContent = message || ""; stateBox.classList.toggle("hidden", !visible); }

      function renderLaws(laws) {
        tbody.replaceChildren();
        document.getElementById("visibleLaws").textContent = laws.length.toLocaleString("ar-EG");
        if (!laws.length) { setState("لا توجد قوانين مطابقة."); return; }
        setState("", false);
        laws.forEach((law, index) => {
          const row = document.createElement("tr");
          row.className = "border-b hover:bg-gray-50";
          row.innerHTML = `<td class="p-3">${index + 1}</td><td class="p-3"><div class="flex items-center gap-2"><span class="text-xl" aria-hidden="true">⚖️</span><span class="font-semibold">${escapeHtml(law.title)}</span></div></td><td class="p-3"><span class="inline-block px-3 py-1 rounded-full text-sm bg-blue-100 text-blue-800">${escapeHtml(law.category || "غير مصنف")}</span></td><td class="p-3"><div class="flex gap-2"><button type="button" data-view="${escapeHtml(law.id)}" class="bg-primary text-white px-3 py-1 rounded hover:bg-secondary">عرض</button><button type="button" data-download="${escapeHtml(law.id)}" class="bg-green-600 text-white px-3 py-1 rounded hover:bg-green-700">تحميل</button></div></td>`;
          tbody.appendChild(row);
        });
      }

      async function downloadLaw(id, title) {
        try {
          const blob = await api.download(`/library/laws/${encodeURIComponent(id)}/file?download=1`);
          const url = URL.createObjectURL(blob);
          const anchor = document.createElement("a");
          anchor.href = url;
          anchor.download = `${title || "law"}.pdf`;
          document.body.appendChild(anchor);
          anchor.click();
          anchor.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        } catch (error) { console.error(error); setState(error?.message || "تعذر تحميل القانون."); }
      }

      async function fetchLaws() {
        setState("جاري تحميل البيانات...", true);
        try {
          const search = document.getElementById("searchLaw").value.trim();
          const laws = await api.get("/library/laws", { params: search ? { search } : {} });
          document.getElementById("totalLaws").textContent = laws.length.toLocaleString("ar-EG");
          renderLaws(laws);
        } catch (error) { console.error(error); tbody.replaceChildren(); setState(error?.message || "فشل تحميل القوانين."); }
      }

      tbody.addEventListener("click", async (event) => {
        const view = event.target.closest("[data-view]");
        if (view) { window.location.href = `law-viewer.html?id=${encodeURIComponent(view.dataset.view)}`; return; }
        const download = event.target.closest("[data-download]");
        if (download) {
          const law = await api.get(`/library/laws/${encodeURIComponent(download.dataset.download)}`);
          downloadLaw(download.dataset.download, law.title);
        }
      });

      document.getElementById("searchLaw").addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(fetchLaws, 250); });
      fetchLaws();
    </script>

    <script src="../assets/js/loadSidebar.js"></script>
    <script src="../assets/js/loadNavbar.js"></script>
  </body>
</html>
