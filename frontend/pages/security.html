<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الأمان | وثيقة</title>
  <link rel="stylesheet" href="../assets/css/fonts.css" />
  <link rel="stylesheet" href="../assets/css/tailwind.min.css" />
  <link rel="stylesheet" href="../assets/css/input.css" />
</head>
<body class="font-cairo bg-light text-primary">
  <div id="app-shell">
    <div id="sidebar-container"></div>
    <div class="app-main">
      <div id="navbar-container"></div>
      <main id="security-page" class="page p-4 md:p-6">
        <div class="mb-6">
          <h1 class="text-2xl font-bold">الأمان</h1>
          <p class="text-gray-500 mt-1">حماية جلسة الدخول الحالية لحسابك داخل النظام.</p>
        </div>

        <section class="bg-white rounded-2xl shadow-sm border p-6 max-w-3xl">
          <div class="flex items-start gap-4">
            <div class="w-12 h-12 rounded-xl bg-green-100 text-green-700 flex items-center justify-center shrink-0">
              <i data-lucide="shield-check" aria-hidden="true"></i>
            </div>
            <div class="flex-1">
              <h2 class="text-lg font-bold">جلسة الدخول الحالية</h2>
              <p id="securityState" class="text-gray-500 mt-1">جاري التحقق من حالة الجلسة...</p>
            </div>
          </div>

          <div class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="rounded-xl border bg-gray-50 p-4">
              <div class="text-sm text-gray-500 mb-1">حالة الجلسة</div>
              <div id="sessionStatus" class="font-bold text-green-700">جاري التحقق...</div>
            </div>
            <div class="rounded-xl border bg-gray-50 p-4">
              <div class="text-sm text-gray-500 mb-1">مدة الجلسة</div>
              <div class="font-bold">7 أيام</div>
            </div>
          </div>

          <div class="mt-6 rounded-xl border border-blue-100 bg-blue-50 p-4 text-sm text-blue-800">
            يتم التحقق من جلسة الدخول من الخادم مع كل طلب. تسجيل الخروج ينهي الجلسة الحالية، كما يمكن إلغاء الجلسات من جانب الخادم عند الحاجة.
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/core/permissions.js"></script>
  <script src="../assets/js/components.js"></script>
  <script>
    async function loadSecurityStatus() {
      const state = document.getElementById('securityState');
      const status = document.getElementById('sessionStatus');
      try {
        const sessions = await api.get('/sessions');
        const current = sessions.find((session) => session.current);
        if (!current || !current.active) {
          status.textContent = 'الجلسة غير نشطة';
          status.className = 'font-bold text-red-700';
          state.textContent = 'انتهت جلسة الدخول الحالية. يرجى تسجيل الدخول مرة أخرى.';
          return;
        }
        status.textContent = 'نشطة وآمنة';
        state.textContent = `الجلسة الحالية صالحة حتى ${new Date(current.expiresAt).toLocaleString('ar-EG')}.`;
      } catch (error) {
        status.textContent = 'تعذر التحقق';
        status.className = 'font-bold text-red-700';
        state.textContent = error.message || 'تعذر التحقق من حالة جلسة الدخول.';
      }
    }

    loadSecurityStatus();
  </script>
</body>
</html>
