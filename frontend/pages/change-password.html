<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <link rel="icon" type="image/png" href="../assets/faviconw.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تغيير كلمة المرور</title>

    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/api.js"></script>
    <link rel="stylesheet" href="../assets/css/fonts.css" />
    <link rel="stylesheet" href="../assets/css/tailwind.min.css" />
    <link rel="stylesheet" href="../assets/vendor/toastify/toastify.css" />
    <script src="../assets/vendor/toastify/toastify.js"></script>
  </head>

  <style>
    body {
      font-family: "Cairo", sans-serif;
    }
  </style>

  <body class="bg-light min-h-screen flex items-center justify-center">
    <div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-md">
      <div class="text-center mb-6">
        <img src="../assets/logo.png" class="w-32 mx-auto mb-4" alt="وثيقة" />
      </div>

      <h1 class="text-2xl font-bold text-center mb-6">تغيير كلمة المرور</h1>

      <div
        id="errorMessage"
        class="hidden bg-red-100 text-red-700 p-3 rounded mb-4"
      ></div>

      <input
        id="newPassword"
        type="password"
        placeholder="كلمة المرور الجديدة"
        class="w-full border rounded p-3 mb-4"
        autocomplete="new-password"
      />

      <input
        id="confirmPassword"
        type="password"
        placeholder="تأكيد كلمة المرور"
        class="w-full border rounded p-3 mb-4"
        autocomplete="new-password"
      />

      <button
        id="changePasswordButton"
        type="button"
        onclick="changePassword()"
        class="w-full bg-primary hover:bg-secondary text-white py-3 rounded-lg transition font-semibold"
      >
        حفظ كلمة المرور
      </button>
    </div>

    <script>
      "use strict";

      const user = auth.getUser() || {};

      if (!auth.isAuthenticated()) {
        window.location.href = "login.html";
      } else if (!user.must_change_password) {
        window.location.href = "dashboard.html";
      }

      function showToast(message, type = "success") {
        Toastify({
          text: message,
          duration: 3000,
          gravity: "top",
          position: "left",
          close: true,
          stopOnFocus: true,
          style: {
            background: type === "success" ? "#16a34a" : "#dc2626",
          },
        }).showToast();
      }

      async function changePassword() {
        const newPassword = document
          .getElementById("newPassword")
          .value.trim();
        const confirmPassword = document
          .getElementById("confirmPassword")
          .value.trim();
        const errorBox = document.getElementById("errorMessage");
        const button = document.getElementById("changePasswordButton");

        errorBox.classList.add("hidden");

        if (!newPassword || !confirmPassword) {
          errorBox.textContent = "يرجى إدخال كلمة المرور";
          errorBox.classList.remove("hidden");
          return;
        }

        if (newPassword.length < 8) {
          errorBox.textContent = "يجب أن تكون كلمة المرور 8 أحرف على الأقل";
          errorBox.classList.remove("hidden");
          return;
        }

        if (newPassword !== confirmPassword) {
          errorBox.textContent = "كلمتا المرور غير متطابقتين";
          errorBox.classList.remove("hidden");
          return;
        }

        try {
          button.disabled = true;
          button.textContent = "جاري حفظ كلمة المرور...";

          await api.post("/auth/change-password", { newPassword });

          user.must_change_password = false;
          localStorage.setItem("user", JSON.stringify(user));

          showToast("تم تغيير كلمة المرور بنجاح", "success");

          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 1500);
        } catch (err) {
          errorBox.textContent = err?.message || "حدث خطأ أثناء تغيير كلمة المرور";
          errorBox.classList.remove("hidden");
          showToast(errorBox.textContent, "error");
          console.error(err);
        } finally {
          button.disabled = false;
          button.textContent = "حفظ كلمة المرور";
        }
      }
    </script>
  </body>
</html>
