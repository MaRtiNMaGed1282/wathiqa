<!doctype html>

<html lang="ar" dir="rtl">
  <head>
    <link rel="icon" type="image/png" href="../assets/faviconw.png" />
    <meta charset="UTF-8" />

    <title>تغيير كلمة المرور</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
  />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#293040",
            secondary: "#3B475C",
            accent: "#D3AC2B",
            light: "#EEE5D9",
            beige: "#D2B68A",
            white: "#FDFFFF",
          },
          fontFamily: {
            cairo: ["Cairo", "sans-serif"],
          },
        },
      },
    };
  </script>

  <style>
    body {
      font-family: "Cairo", sans-serif;
    }
  </style>

  <body class="bg-light min-h-screen flex items-center justify-center">
    <div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-md">
      <div class="text-center mb-6">
        <img src="../assets/logo.png" class="w-32 mx-auto mb-4" />
      </div>
      <h1 class="text-2xl font-bold text-center mb-6">تغيير كلمة المرور</h1>

      <div
        id="errorMessage"
        class="hidden bg-red-100 text-red-700 p-3 rounded mb-4"
      ></div>

      <input
        id="newPassword"
        type="password"
        placeholder="كلمة المرور الجديدة"
        class="w-full border rounded p-3 mb-4"
      />

      <input
        id="confirmPassword"
        type="password"
        placeholder="تأكيد كلمة المرور"
        class="w-full border rounded p-3 mb-4"
      />

      <button
        onclick="changePassword()"
        class="w-full bg-primary hover:bg-secondary text-white py-3 rounded-lg transition font-semibold"
      >
        حفظ كلمة المرور
      </button>
    </div>

    <script>
      const user = JSON.parse(localStorage.getItem("user") || "{}");

      if (!user.email) {
        window.location.href = "login.html";
      }

      async function changePassword() {
        const newPassword = document.getElementById("newPassword").value;

        const confirmPassword =
          document.getElementById("confirmPassword").value;

        const errorBox = document.getElementById("errorMessage");

        if (newPassword !== confirmPassword) {
          errorBox.textContent = "كلمتا المرور غير متطابقتين";

          errorBox.classList.remove("hidden");

          return;
        }

        const user = JSON.parse(localStorage.getItem("user"));

        const response = await fetch(
          "http://localhost:5000/api/auth/change-password",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify({
              email: user.email,
              newPassword,
            }),
          },
        );

        const data = await response.json();

        if (!response.ok) {
          errorBox.textContent = data.message;

          errorBox.classList.remove("hidden");

          return;
        }

        showToast("تم تغيير كلمة المرور بنجاح", "success");
        user.must_change_password = false;

        localStorage.setItem("user", JSON.stringify(user));
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1500);
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  </body>
</html>
