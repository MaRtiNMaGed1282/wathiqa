<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <link rel="icon" type="image/png" href="../assets/faviconw.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تغيير كلمة المرور | وثيقة</title>

    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/api.js"></script>
    <link rel="stylesheet" href="../assets/css/fonts.css" />
    <link rel="stylesheet" href="../assets/css/tailwind.min.css" />
    <link rel="stylesheet" href="../assets/vendor/toastify/toastify.css" />
  </head>

  <body class="bg-light min-h-screen flex items-center justify-center p-6">
    <div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-md">
      <div class="text-center mb-6">
        <img src="../assets/logo.png" class="w-32 mx-auto mb-4" alt="وثيقة" />
      </div>

      <h1 class="text-2xl font-bold text-center mb-6">تغيير كلمة المرور</h1>

      <div
        id="errorMessage"
        class="hidden bg-red-100 text-red-700 p-3 rounded mb-4"
        role="alert"
      ></div>

      <form id="changePasswordForm" class="space-y-4">
        <div>
          <label for="newPassword" class="block mb-2 font-semibold">
            كلمة المرور الجديدة
          </label>
          <input
            id="newPassword"
            type="password"
            minlength="8"
            autocomplete="new-password"
            required
            class="w-full border rounded p-3"
          />
        </div>

        <div>
          <label for="confirmPassword" class="block mb-2 font-semibold">
            تأكيد كلمة المرور
          </label>
          <input
            id="confirmPassword"
            type="password"
            minlength="8"
            autocomplete="new-password"
            required
            class="w-full border rounded p-3"
          />
        </div>

        <button
          id="changePasswordBtn"
          type="submit"
          class="w-full bg-primary hover:bg-secondary text-white py-3 rounded-lg transition font-semibold"
        >
          حفظ كلمة المرور
        </button>
      </form>
    </div>

    <script src="../assets/vendor/toastify/toastify.js"></script>

    <script>
      "use strict";

      const form = document.getElementById("changePasswordForm");
      const errorBox = document.getElementById("errorMessage");
      const button = document.getElementById("changePasswordBtn");

      function showError(message) {
        errorBox.textContent = message;
        errorBox.classList.remove("hidden");
      }

      function showSuccess(message) {
        if (window.Toastify) {
          Toastify({
            text: message,
            duration: 2500,
            gravity: "top",
            position: "center",
          }).showToast();
        }
      }

      if (!auth.isAuthenticated()) {
        // auth.js handles the redirect.
      } else if (!auth.mustChangePassword()) {
        window.location.replace("dashboard.html");
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorBox.classList.add("hidden");

        const newPassword = document.getElementById("newPassword").value.trim();
        const confirmPassword = document
          .getElementById("confirmPassword")
          .value.trim();

        if (newPassword.length < 8) {
          showError("يجب أن تكون كلمة المرور 8 أحرف على الأقل");
          return;
        }

        if (newPassword !== confirmPassword) {
          showError("كلمتا المرور غير متطابقتين");
          return;
        }

        try {
          button.disabled = true;
          button.textContent = "جاري حفظ كلمة المرور...";

          const data = await api.post("/auth/change-password", {
            newPassword,
          });

          const user = auth.getUser() || {};
          auth.setUser({ ...user, must_change_password: false });

          showSuccess(data?.message || "تم تغيير كلمة المرور بنجاح");

          setTimeout(() => {
            window.location.replace("dashboard.html");
          }, 800);
        } catch (error) {
          showError(error?.message || "تعذر تغيير كلمة المرور");
        } finally {
          button.disabled = false;
          button.textContent = "حفظ كلمة المرور";
        }
      });
    </script>
  </body>
</html>
