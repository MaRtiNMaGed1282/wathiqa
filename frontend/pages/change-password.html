<!doctype html>

<html lang="ar" dir="rtl">
  <head>
    <link rel="icon" type="image/png" href="../assets/faviconw.png" />
    <meta charset="UTF-8" />

    <title>تغيير كلمة المرور</title>

    <link rel="stylesheet" href="../assets/css/tailwind.min.css" />
  </head>
  <link rel="stylesheet" href="../assets/vendor/toastify/toastify.css" />

  <style>
    body {
      font-family: "Cairo", sans-serif;
    }
  </style>

  <body class="bg-light min-h-screen flex items-center justify-center">
    <div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-md">
      <div class="text-center mb-6">
        <img src="../assets/logo.png" class="w-32 mx-auto mb-4" />
      </div>
      <h1 class="text-2xl font-bold text-center mb-6">تغيير كلمة المرور</h1>

      <div
        id="errorMessage"
        class="hidden bg-red-100 text-red-700 p-3 rounded mb-4"
      ></div>

      <input
        id="newPassword"
        type="password"
        placeholder="كلمة المرور الجديدة"
        class="w-full border rounded p-3 mb-4"
      />

      <input
        id="confirmPassword"
        type="password"
        placeholder="تأكيد كلمة المرور"
        class="w-full border rounded p-3 mb-4"
      />

      <button
        onclick="changePassword()"
        class="w-full bg-primary hover:bg-secondary text-white py-3 rounded-lg transition font-semibold"
      >
        حفظ كلمة المرور
      </button>
    </div>

    <script src="../assets/js/api.js"></script>

    <script>
      function showToast(message, type = "success") {
        Toastify({
          text: message,
          duration: 3000,
          gravity: "top",
          position: "left",
          close: true,
          stopOnFocus: true,
          style: {
            background: type === "success" ? "#16a34a" : "#dc2626",
          },
        }).showToast();
      }

      const user = JSON.parse(localStorage.getItem("user") || "{}");

      if (!user.email) {
        window.location.href = "login.html";
      }

      if (!user.must_change_password) {
        window.location.href = "dashboard.html";
      }

      async function changePassword() {
        const newPassword = document.getElementById("newPassword").value.trim();

        const confirmPassword = document
          .getElementById("confirmPassword")
          .value.trim();

        const errorBox = document.getElementById("errorMessage");

        const button = document.querySelector("button");

        errorBox.classList.add("hidden");

        if (!newPassword || !confirmPassword) {
          errorBox.textContent = "يرجى إدخال كلمة المرور";

          errorBox.classList.remove("hidden");

          return;
        }

        if (newPassword.length < 8) {
          errorBox.textContent = "يجب أن تكون كلمة المرور 8 أحرف على الأقل";

          errorBox.classList.remove("hidden");

          return;
        }

        if (newPassword !== confirmPassword) {
          errorBox.textContent = "كلمتا المرور غير متطابقتين";

          errorBox.classList.remove("hidden");

          return;
        }

        try {
          button.disabled = true;
          button.textContent = "جاري حفظ كلمة المرور...";

          const data = await api.post("/auth/change-password", {
            email: user.email,
            newPassword,
          });

          user.must_change_password = false;

          localStorage.setItem("user", JSON.stringify(user));

          showToast("تم تغيير كلمة المرور بنجاح", "success");

          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 1500);
        } catch (err) {
          errorBox.textContent = err.message;

          errorBox.classList.remove("hidden");

          showToast(err.message, "error");

          console.error(err);
        } finally {
          button.disabled = false;
          button.textContent = "حفظ كلمة المرور";
        }
      }
    </script>
    <script src="../assets/vendor/toastify/toastify.js"></script>
    <script src="../assets/vendor/sweetalert2/sweetalert2.all.min.js"></script>
    <script src="../assets/vendor/xlsx/xlsx.full.min.js"></script>
  </body>
</html>
