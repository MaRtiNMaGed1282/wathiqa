<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ملف الموكل | وثيقة</title>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/core/ui.js"></script>
  <script src="../assets/js/core/permissions.js"></script>
  <script src="../assets/js/loadSidebar.js"></script>
  <script src="../assets/js/loadNavbar.js"></script>
  <script src="../assets/vendor/sweetalert2/sweetalert2.all.min.js"></script>
  <script src="../assets/vendor/toastify/toastify.js"></script>
  <link rel="stylesheet" href="../assets/css/fonts.css">
  <link rel="stylesheet" href="../assets/css/tailwind.min.css">
  <link rel="stylesheet" href="../assets/vendor/toastify/toastify.css">
</head>
<body class="font-cairo bg-light text-primary">
  <div id="app-shell" class="min-h-screen">
    <div id="sidebar-container"></div>
    <div id="app">
      <div id="navbar-container"></div>
      <main class="p-4 md:p-6 max-w-7xl mx-auto">
        <div class="flex justify-between items-center mb-6"><div><h1 id="clientName" class="text-2xl font-bold">ملف الموكل</h1><p id="clientCode" class="text-gray-500"></p></div><button id="backButton" class="bg-primary text-white px-4 py-2 rounded-lg">رجوع</button></div>

        <section class="bg-white rounded-xl shadow p-6 mb-6"><h2 class="text-xl font-bold mb-4">بيانات الموكل</h2><div id="clientDetails" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div></section>

        <section id="financialSection" class="hidden bg-white rounded-xl shadow p-6 mb-6"><h2 class="text-xl font-bold mb-4">الملخص المالي</h2><div class="grid grid-cols-2 md:grid-cols-4 gap-4"><div class="p-4 bg-gray-50 rounded-lg"><span>عدد القضايا</span><strong id="totalCases" class="block text-2xl mt-1">0</strong></div><div class="p-4 bg-gray-50 rounded-lg"><span>عدد الخدمات</span><strong id="totalServices" class="block text-2xl mt-1">0</strong></div><div class="p-4 bg-gray-50 rounded-lg"><span>إجمالي الأتعاب</span><strong id="totalFees" class="block text-2xl mt-1">0 جنيه</strong></div><div class="p-4 bg-gray-50 rounded-lg"><span>المدفوع</span><strong id="paid" class="block text-2xl mt-1 text-green-600">0 جنيه</strong></div><div class="p-4 bg-gray-50 rounded-lg"><span>المتبقي</span><strong id="remaining" class="block text-2xl mt-1 text-red-600">0 جنيه</strong></div><div class="p-4 bg-gray-50 rounded-lg"><span>المصروفات</span><strong id="expenses" class="block text-2xl mt-1">0 جنيه</strong></div><div class="p-4 bg-gray-50 rounded-lg"><span>صافي الربح</span><strong id="profit" class="block text-2xl mt-1">0 جنيه</strong></div><div class="p-4 bg-gray-50 rounded-lg"><span>نسبة التحصيل</span><strong id="collectionRate" class="block text-2xl mt-1">0%</strong></div></div></section>

        <section class="bg-white rounded-xl shadow p-6 mb-6"><div class="flex justify-between items-center mb-4"><h2 class="text-xl font-bold">التوكيلات</h2><button id="addAttorney" class="bg-primary text-white px-4 py-2 rounded-lg">+ إضافة توكيل</button></div><div id="attorneys" class="space-y-3"></div></section>

        <section class="bg-white rounded-xl shadow p-4 mb-6"><div class="flex gap-2"><button id="casesTab" class="bg-primary text-white px-5 py-2 rounded-lg">القضايا</button><button id="servicesTab" class="bg-gray-200 px-5 py-2 rounded-lg">الخدمات</button></div></section>

        <section id="casesSection" class="bg-white rounded-xl shadow p-6 mb-6"><h2 class="text-xl font-bold mb-4">القضايا</h2><div id="cases" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div></section>
        <section id="servicesSection" class="hidden bg-white rounded-xl shadow p-6 mb-6"><h2 class="text-xl font-bold mb-4">الخدمات</h2><div id="services" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div></section>

        <section class="bg-white rounded-xl shadow p-6"><h2 class="text-xl font-bold mb-4">سجل النشاط</h2><div id="activity">جاري التحميل...</div></section>
      </main>
    </div>
  </div>

  <div id="attorneyModal" class="hidden fixed inset-0 z-50 bg-black/50 items-center justify-center p-4"><div class="bg-white rounded-xl shadow-xl p-6 w-full max-w-xl"><h2 class="text-xl font-bold mb-4">إضافة توكيل</h2><form id="attorneyForm" class="space-y-3"><input id="attorney_number" required class="w-full border rounded-lg p-3" placeholder="رقم التوكيل"><input id="attorney_type" class="w-full border rounded-lg p-3" placeholder="نوع التوكيل"><input id="issue_date" type="date" class="w-full border rounded-lg p-3"><input id="issuing_office" class="w-full border rounded-lg p-3" placeholder="جهة الإصدار"><textarea id="attorney_notes" class="w-full border rounded-lg p-3" placeholder="ملاحظات"></textarea><input id="attorney_file" type="file" class="w-full border rounded-lg p-3"><div class="flex justify-end gap-3"><button id="closeAttorney" type="button" class="bg-gray-200 px-5 py-2 rounded-lg">إلغاء</button><button id="saveAttorney" type="submit" class="bg-primary text-white px-5 py-2 rounded-lg">حفظ</button></div></form></div></div>
  <script src="../assets/js/pages/client-profile.js"></script>
</body>
</html>
