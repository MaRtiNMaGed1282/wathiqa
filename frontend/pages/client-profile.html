<!doctype html>

<html lang="ar" dir="rtl">
  <head>
    <link rel="icon" type="image/png" href="../assets/faviconw.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>بيانات الموكل</title>

    <script src="../assets/js/auth.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: Cairo, sans-serif;
      }
    </style>
  </head>

  <body class="bg-[#e8e3da] min-h-screen">
    <div class="max-w-7xl mx-auto p-6">
      <!-- Header -->

      <div class="flex justify-between items-center mb-6">
        <h1 id="clientNameHeader" class="text-3xl font-bold text-[#1f2a44]">
          بيانات الموكل
        </h1>

        <button
          onclick="history.back()"
          class="bg-[#1f2a44] text-white px-4 py-2 rounded-lg"
        >
          رجوع
        </button>
      </div>

      <!-- Client Info -->

      <div class="bg-white rounded-xl shadow p-6 mb-6">
        <h2 class="text-xl font-bold text-[#1f2a44] mb-4 border-b pb-2">
          بيانات الموكل
        </h2>

        <div id="clientDetails" class="text-center text-gray-500">
          جاري التحميل...
        </div>
      </div>

      <!-- Financial Summary -->
      <div class="bg-white rounded-xl shadow p-6 mb-6">
        <h2 class="text-xl font-bold text-[#1f2a44] mb-4 border-b pb-2">
          الملخص المالي
        </h2>

        <div class="grid md:grid-cols-4 gap-4 text-center">
          <div class="bg-gray-50 rounded-lg p-4">
            <p class="text-gray-500 text-sm">عدد القضايا</p>

            <p id="totalCases" class="text-2xl font-bold text-[#1f2a44]">0</p>
          </div>

          <div class="bg-gray-50 rounded-lg p-4">
            <p class="text-gray-500 text-sm">إجمالي الأتعاب</p>

            <p id="totalFees" class="text-2xl font-bold text-[#1f2a44]">
              0 جنيه
            </p>
          </div>

          <div class="bg-gray-50 rounded-lg p-4">
            <p class="text-gray-500 text-sm">المدفوع</p>

            <p id="paidAmount" class="text-2xl font-bold text-green-600">
              0 جنيه
            </p>
          </div>

          <div class="bg-gray-50 rounded-lg p-4">
            <p class="text-gray-500 text-sm">المتبقي</p>

            <p id="remainingAmount" class="text-2xl font-bold text-red-600">
              0 جنيه
            </p>
          </div>
        </div>
      </div>

      <!-- Cases -->

      <div class="bg-white rounded-xl shadow p-6">
        <h2 class="text-xl font-bold text-[#1f2a44] mb-4 border-b pb-2">
          القضايا
        </h2>

        <div id="clientCases" class="grid md:grid-cols-2 gap-4"></div>
      </div>
    </div>

    <script>
      const CLIENTS_API = "http://localhost:5000/api/clients";

      const params = new URLSearchParams(window.location.search);

      const clientId = params.get("id");

      async function loadClient() {
        try {
          const res = await fetch(`${CLIENTS_API}/${clientId}`);

          if (!res.ok) throw new Error("Client not found");

          const client = await res.json();

          document.getElementById("clientNameHeader").textContent =
            client.full_name;

          document.getElementById("clientDetails").innerHTML = `
        <div class="grid md:grid-cols-2 gap-6">

          <div>
            <p class="text-gray-500">
              الاسم
            </p>

            <p class="font-bold text-lg">
              ${client.full_name}
            </p>
          </div>

          <div>
            <p class="text-gray-500">
              الرقم القومي
            </p>

            <p class="font-bold text-lg">
              ${client.national_id}
            </p>
          </div>

          <div>
            <p class="text-gray-500">
              الهاتف
            </p>

            <p class="font-bold text-lg">
              ${client.phone}
            </p>
          </div>

          <div>
            <p class="text-gray-500">
              العنوان
            </p>

            <p class="font-bold text-lg">
              ${client.address}
            </p>
          </div>

          <div class="md:col-span-2">
            <p class="text-gray-500">
              ملاحظات
            </p>

            <p class="font-bold text-lg">
              ${client.notes || "-"}
            </p>
          </div>

        </div>
      `;
        } catch (err) {
          console.error(err);

          document.getElementById("clientDetails").innerHTML = `
        <p class="text-red-600">
          فشل تحميل بيانات الموكل
        </p>
      `;
        }
      }

      async function loadClientCases() {
        try {
          const res = await fetch(`${CLIENTS_API}/${clientId}/cases-financial`);

          const cases = await res.json();

          const container = document.getElementById("clientCases");

          if (!cases.length) {
            container.innerHTML = `
        <div class="text-gray-500">
          لا توجد قضايا لهذا الموكل
        </div>
      `;

            return;
          }

          container.innerHTML = cases
            .map(
              (c) => `
            <a
              href="case-profile.html?id=${c.case_id}"
              class="block bg-gray-50 border rounded-lg p-5 hover:shadow transition"
            >

              <div class="flex justify-between mb-3">

                <h3 class="font-bold text-lg">
                  ${c.case_title}
                </h3>

                <span
                  class="px-2 py-1 bg-blue-100 text-blue-800 rounded text-sm"
                >
                  ${c.case_status}
                </span>

              </div>

              <div class="text-sm text-gray-500 mb-4">
                رقم القضية:
                ${c.court_case_number}
              </div>

              <div class="grid grid-cols-3 gap-4 text-center">

                <div>
                  <p class="text-xs text-gray-500">
                    الأتعاب
                  </p>

                  <p class="font-bold">
                    ${Number(c.total_fees).toLocaleString()}
                  </p>
                </div>

                <div>
                  <p class="text-xs text-gray-500">
                    المدفوع
                  </p>

                  <p class="font-bold text-green-600">
                    ${Number(c.paid).toLocaleString()}
                  </p>
                </div>

                <div>
                  <p class="text-xs text-gray-500">
                    المتبقي
                  </p>

                  <p class="font-bold text-red-600">
                    ${Number(c.remaining).toLocaleString()}
                  </p>
                </div>

              </div>

            </a>
          `,
            )
            .join("");
        } catch (err) {
          console.error(err);
        }
      }

      loadClient();
      loadFinancialSummary();
      loadClientCases();

      async function loadFinancialSummary() {
        try {
          const res = await fetch(
            `${CLIENTS_API}/${clientId}/financial-summary`,
          );

          const data = await res.json();

          document.getElementById("totalCases").textContent =
            data.total_cases || 0;

          document.getElementById("totalFees").textContent = `${Number(
            data.total_fees || 0,
          ).toLocaleString()} جنيه`;

          document.getElementById("paidAmount").textContent = `${Number(
            data.total_paid || 0,
          ).toLocaleString()} جنيه`;

          document.getElementById("remainingAmount").textContent = `${Number(
            data.remaining || 0,
          ).toLocaleString()} جنيه`;
        } catch (err) {
          console.error(err);
        }
      }
    </script>
  </body>
</html>
