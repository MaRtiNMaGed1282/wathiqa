<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الأرشيف</title>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <link rel="stylesheet" href="../assets/css/fonts.css" />
  <link rel="stylesheet" href="../assets/css/tailwind.min.css" />
  <link rel="stylesheet" href="../assets/vendor/toastify/toastify.css" />
  <script src="../assets/vendor/toastify/toastify.js"></script>
  <script src="../assets/vendor/sweetalert2/sweetalert2.all.min.js"></script>
</head>
<body class="font-cairo bg-light text-primary min-h-screen">
  <div id="app-shell">
    <div id="sidebar-container"></div>
    <div id="app">
      <div id="navbar-container"></div>
      <main class="page"><div class="page-content">
        <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
          <div><h1 class="text-3xl font-bold">الأرشيف</h1><p class="text-gray-500 mt-2">إدارة السجلات المؤرشفة واستعادتها</p></div>
          <select id="typeFilter" class="border rounded-lg px-4 py-2 bg-white"><option value="">كل الأنواع</option><option value="client">الموكلين</option><option value="case">القضايا</option><option value="service">الخدمات</option></select>
        </div>
        <div class="bg-white rounded-xl shadow p-5 mb-6">
          <h2 class="font-bold text-lg mb-4">أرشفة سجل</h2>
          <div class="grid grid-cols-1 md:grid-cols-4 gap-3 items-end">
            <label class="text-sm">نوع السجل<select id="archiveType" class="block w-full border rounded-lg px-3 py-2 mt-1"><option value="client">موكل</option><option value="case">قضية</option><option value="service">خدمة</option></select></label>
            <label class="text-sm">رقم السجل<input id="archiveRecordId" type="number" min="1" class="block w-full border rounded-lg px-3 py-2 mt-1" /></label>
            <label class="text-sm md:col-span-1">السبب<input id="archiveReason" class="block w-full border rounded-lg px-3 py-2 mt-1" maxlength="500" /></label>
            <button id="archiveButton" class="bg-primary text-white px-4 py-2 rounded-lg">أرشفة</button>
          </div>
          <p class="text-xs text-gray-500 mt-3">الأرشفة لا تحذف السجل من قاعدة البيانات، ويمكن استعادته لاحقاً.</p>
        </div>
        <div class="bg-white rounded-xl shadow overflow-hidden">
          <div id="state" class="p-6 text-center text-gray-500">جاري التحميل...</div>
          <div class="overflow-x-auto"><table id="archiveTable" class="w-full text-right hidden"><thead class="bg-gray-50"><tr>
            <th class="p-3">النوع</th><th class="p-3">رقم السجل</th><th class="p-3">سبب الأرشفة</th><th class="p-3">بواسطة</th><th class="p-3">تاريخ الأرشفة</th><th class="p-3">الإجراء</th>
          </tr></thead><tbody id="archiveBody"></tbody></table></div>
        </div>
      </div></main>
    </div>
  </div>
  <script src="../assets/js/loadSidebar.js"></script><script src="../assets/js/loadNavbar.js"></script>
  <script>
    const labels = { client: 'موكل', case: 'قضية', service: 'خدمة' };

    function showToast(message, type = 'success') {
      if (!message) return;
      if (window.Toastify) {
        Toastify({
          text: message,
          duration: 3500,
          gravity: 'top',
          position: 'left',
          close: true,
          style: {
            background: type === 'success' ? '#16a34a' : '#dc2626',
            color: '#ffffff',
            fontFamily: 'Cairo, sans-serif',
            fontWeight: '600',
          },
        }).showToast();
      }
    }

    async function confirmAction(title, text, confirmText) {
      if (!window.Swal) return false;
      const result = await Swal.fire({
        title,
        text,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: confirmText,
        cancelButtonText: 'إلغاء',
        reverseButtons: true,
        confirmButtonColor: '#273247',
        cancelButtonColor: '#6b7280',
      });
      return result.isConfirmed;
    }

    async function loadArchive() {
      const type = document.getElementById('typeFilter').value, state = document.getElementById('state'), table = document.getElementById('archiveTable'), body = document.getElementById('archiveBody');
      state.textContent = 'جاري التحميل...'; table.classList.add('hidden');
      try {
        const rows = await api.get(`/archive${type ? `?type=${encodeURIComponent(type)}` : ''}`); body.innerHTML = '';
        if (!rows.length) { state.textContent = 'لا توجد سجلات مؤرشفة'; return; }
        rows.forEach(row => { const tr = document.createElement('tr'); tr.className = 'border-t'; tr.innerHTML = `<td class="p-3">${labels[row.entity_type] || row.entity_type}</td><td class="p-3">${row.record_id}</td><td class="p-3">${row.reason || '—'}</td><td class="p-3">${row.archived_by_name || '—'}</td><td class="p-3">${row.archived_at || '—'}</td><td class="p-3"><button class="restore-btn bg-primary text-white px-3 py-2 rounded-lg" data-id="${row.id}">استعادة</button></td>`; body.appendChild(tr); });
        state.textContent = ''; table.classList.remove('hidden');
        body.querySelectorAll('.restore-btn').forEach(btn => btn.addEventListener('click', async () => {
          const confirmed = await confirmAction('تأكيد الاستعادة', 'هل تريد استعادة هذا السجل؟', 'استعادة');
          if (!confirmed) return;
          try {
            await api.put(`/archive/${btn.dataset.id}/restore`, {});
            showToast('تمت استعادة السجل بنجاح', 'success');
            await loadArchive();
          } catch (error) {
            showToast(error.message || 'تعذر استعادة السجل', 'error');
          }
        }));
      } catch (error) { state.textContent = error.message || 'تعذر تحميل الأرشيف'; }
    }

    document.getElementById('archiveButton').addEventListener('click', async () => {
      const entityType = document.getElementById('archiveType').value, recordId = document.getElementById('archiveRecordId').value, reason = document.getElementById('archiveReason').value.trim();
      if (!recordId) return showToast('أدخل رقم السجل', 'error');
      const confirmed = await confirmAction('تأكيد الأرشفة', 'هل تريد أرشفة هذا السجل؟', 'أرشفة');
      if (!confirmed) return;
      try {
        await api.post('/archive', { entityType, recordId: Number(recordId), reason: reason || null });
        document.getElementById('archiveRecordId').value = '';
        document.getElementById('archiveReason').value = '';
        showToast('تمت أرشفة السجل بنجاح', 'success');
        await loadArchive();
      } catch (error) {
        showToast(error.message || 'تعذر أرشفة السجل', 'error');
      }
    });
    document.getElementById('typeFilter').addEventListener('change', loadArchive); window.addEventListener('DOMContentLoaded', loadArchive);
  </script>
</body></html>
