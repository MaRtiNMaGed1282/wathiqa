<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الأرشيف</title>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <link rel="stylesheet" href="../assets/css/fonts.css" />
  <link rel="stylesheet" href="../assets/css/tailwind.min.css" />
</head>
<body class="font-cairo bg-light text-primary min-h-screen">
  <div id="app-shell">
    <div id="sidebar-container"></div>
    <div id="app">
      <div id="navbar-container"></div>
      <main class="page">
        <div class="page-content">
          <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
            <div>
              <h1 class="text-3xl font-bold">الأرشيف</h1>
              <p class="text-gray-500 mt-2">السجلات المؤرشفة مع إمكانية استعادتها</p>
            </div>
            <select id="typeFilter" class="border rounded-lg px-4 py-2 bg-white">
              <option value="">كل الأنواع</option>
              <option value="client">الموكلين</option>
              <option value="case">القضايا</option>
              <option value="service">الخدمات</option>
            </select>
          </div>
          <div class="bg-white rounded-xl shadow overflow-hidden">
            <div id="state" class="p-6 text-center text-gray-500">جاري التحميل...</div>
            <div class="overflow-x-auto">
              <table id="archiveTable" class="w-full text-right hidden">
                <thead class="bg-gray-50"><tr>
                  <th class="p-3">النوع</th><th class="p-3">رقم السجل</th><th class="p-3">سبب الأرشفة</th>
                  <th class="p-3">بواسطة</th><th class="p-3">تاريخ الأرشفة</th><th class="p-3">الإجراء</th>
                </tr></thead>
                <tbody id="archiveBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="../assets/js/loadSidebar.js"></script>
  <script src="../assets/js/loadNavbar.js"></script>
  <script>
    const labels = { client: 'موكل', case: 'قضية', service: 'خدمة' };
    async function loadArchive() {
      const type = document.getElementById('typeFilter').value;
      const state = document.getElementById('state');
      const table = document.getElementById('archiveTable');
      const body = document.getElementById('archiveBody');
      state.textContent = 'جاري التحميل...';
      table.classList.add('hidden');
      try {
        const rows = await api.get(`/archive${type ? `?type=${encodeURIComponent(type)}` : ''}`);
        body.innerHTML = '';
        if (!rows.length) { state.textContent = 'لا توجد سجلات مؤرشفة'; return; }
        rows.forEach(row => {
          const tr = document.createElement('tr');
          tr.className = 'border-t';
          tr.innerHTML = `<td class="p-3">${labels[row.entity_type] || row.entity_type}</td>
            <td class="p-3">${row.record_id}</td><td class="p-3">${row.reason || '—'}</td>
            <td class="p-3">${row.archived_by_name || '—'}</td><td class="p-3">${row.archived_at || '—'}</td>
            <td class="p-3"><button class="restore-btn bg-primary text-white px-3 py-2 rounded-lg" data-id="${row.id}">استعادة</button></td>`;
          body.appendChild(tr);
        });
        state.textContent = '';
        table.classList.remove('hidden');
        body.querySelectorAll('.restore-btn').forEach(btn => btn.addEventListener('click', async () => {
          if (!confirm('هل تريد استعادة هذا السجل؟')) return;
          try { await api.put(`/archive/${btn.dataset.id}/restore`, {}); await loadArchive(); }
          catch (error) { alert(error.message || 'تعذر استعادة السجل'); }
        }));
      } catch (error) { state.textContent = error.message || 'تعذر تحميل الأرشيف'; }
    }
    document.getElementById('typeFilter').addEventListener('change', loadArchive);
    window.addEventListener('DOMContentLoaded', loadArchive);
  </script>
</body>
</html>
