<header id="navbar" class="app-navbar" role="banner">
  <div class="navbar-left" id="navbar-left"></div>

  <div class="navbar-center" id="navbar-center">
    <div class="navbar-search" role="search">
      <svg class="navbar-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-4-4"></path>
      </svg>

      <input
        id="headerSearchInput"
        type="search"
        class="search-input"
        placeholder="ابحث عن موكل، قضية، رقم قضية..."
        autocomplete="off"
        spellcheck="false"
        autocorrect="off"
        autocapitalize="off"
        aria-label="البحث العام"
        aria-expanded="false"
        aria-controls="headerSearchResults"
      />

      <div
        id="headerSearchResults"
        class="search-results"
        aria-hidden="true"
        role="listbox"
        aria-label="نتائج البحث"
      ></div>
    </div>
  </div>

  <div class="navbar-right" id="navbar-right">
    <button
      id="navbar-notifications-button"
      type="button"
      class="navbar-action"
      data-action="toggle-notifications"
      aria-label="الإشعارات"
      aria-expanded="false"
      aria-controls="notificationsDropdown"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="21" height="21" aria-hidden="true">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>

      <span
        id="navbar-notifications-badge"
        class="navbar-badge d-none"
        aria-live="polite"
      >
        0
      </span>
    </button>

    <div id="navbar-user-container" class="dropdown"></div>
  </div>
</header>
